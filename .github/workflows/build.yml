name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeiRi-win-x64
          path: app/
          if-no-files-found: error
